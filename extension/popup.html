<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detector AI</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Phishing Detector AI</h1>
            <p class="subtitle">AI-Powered Phishing Analysis</p>
        </div>

        <!-- Status Indicator -->
        <div id="statusIndicator" class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Checking API...</span>
        </div>

        <!-- Input Section -->
        <div class="input-section">
            <label for="messageInput">Paste message or URL to analyze:</label>
            <textarea
                id="messageInput"
                placeholder="Paste email text, SMS message, or suspicious URL here..."
                rows="8"
            ></textarea>

            <div class="input-controls">
                <select id="messageType">
                    <option value="email">Email</option>
                    <option value="sms">SMS</option>
                    <option value="url">URL</option>
                    <option value="chat">Chat Message</option>
                </select>
                <button id="analyzeBtn" class="btn-primary">
                    <span id="analyzeText">Analyze Message</span>
                    <span id="analyzeLoader" class="loader" style="display: none;"></span>
                </button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button id="analyzeSelectedBtn" class="btn-secondary">
                Analyze Selected Text
            </button>
            <button id="clearBtn" class="btn-secondary">
                Clear
            </button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="results-section" style="display: none;">
            <h2>Analysis Results</h2>

            <!-- Verdict Card -->
            <div id="verdictCard" class="verdict-card">
                <div class="verdict-header">
                    <span id="verdictIcon" class="verdict-icon"></span>
                    <span id="verdictText" class="verdict-text"></span>
                </div>
                <div class="risk-score">
                    <span>Risk Score:</span>
                    <span id="riskScore" class="score-value"></span>
                </div>
            </div>

            <!-- Explanation -->
            <div class="result-card">
                <h3>Analysis Summary</h3>
                <p id="explanation"></p>
            </div>

            <!-- Red Flags -->
            <div id="redFlagsSection" class="result-card" style="display: none;">
                <h3>Red Flags Detected</h3>
                <ul id="redFlagsList" class="red-flags-list"></ul>
            </div>

            <!-- Indicators -->
            <div class="result-card">
                <h3>Detailed Indicators</h3>
                <div id="indicatorsGrid" class="indicators-grid"></div>
            </div>

            <!-- User Advice -->
            <div class="result-card advice-card">
                <h3>Recommended Action</h3>
                <p id="userAdvice"></p>
            </div>
        </div>

        <!-- Error Section -->
        <div id="errorSection" class="error-section" style="display: none;">
            <div class="error-content">
                <span class="error-icon">⚠️</span>
                <p id="errorMessage"></p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Powered by Google Gemini AI</p>
            <p class="disclaimer">Always verify suspicious messages through official channels</p>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
